<text x="805.0" y="607" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="9.2" font-weight="700" fill="#1a7f37" text-anchor="middle">LISTENING</text>
<rect x="960" y="560" width="160" height="64" rx="14" ry="14" fill="#faf5ff" stroke="#dcccf7" stroke-width="1.2"/>
