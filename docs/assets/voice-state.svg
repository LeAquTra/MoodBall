<text x="370.0" y="467" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="9.2" font-weight="700" fill="#9a6700" text-anchor="middle">ARMING</text>
<rect x="500" y="420" width="160" height="64" rx="14" ry="14" fill="#eef7ff" stroke="#b6d7f5" stroke-width="1.2"/>
<text x="580.0" y="447" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="middle">armed</text>
<text x="580.0" y="467" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="9.2" font-weight="700" fill="#0969da" text-anchor="middle">ARMED</text>
<rect x="720" y="240" width="170" height="64" rx="14" ry="14" fill="#f0fbfb" stroke="#b5e4e4" stroke-width="1.2"/>
<text x="805.0" y="267" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="middle">triggered</text>
<text x="805.0" y="287" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="9.2" font-weight="700" fill="#0d7d7d" text-anchor="middle">TRIGGERED</text>
