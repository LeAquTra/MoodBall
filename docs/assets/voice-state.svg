<line x1="420" y1="946" x2="446" y2="946" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="433" cy="946" r="3.4" fill="#1a7f37"/>
<text x="454" y="950" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" font-weight="400" fill="#57606a" text-anchor="start">聆听</text>
<line x1="590" y1="946" x2="616" y2="946" stroke="#8250df" stroke-width="2.4"/>
<circle cx="603" cy="946" r="3.4" fill="#8250df"/>
<text x="624" y="950" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" font-weight="400" fill="#57606a" text-anchor="start">思考 / 行动</text>
<line x1="760" y1="946" x2="786" y2="946" stroke="#cf222e" stroke-width="2.4"/>
<circle cx="773" cy="946" r="3.4" fill="#cf222e"/>
<text x="794" y="950" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" font-weight="400" fill="#57606a" text-anchor="start">异常</text>
<text x="980" y="950" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" font-weight="400" fill="#8c959f" text-anchor="start">注：首版不做 barge-in；打断只保留「点击停止」这一条确定性路径。</text>
</svg>