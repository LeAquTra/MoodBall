<path d="M 1260 560 L 1260 304" fill="none" stroke="#8250df" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8250df)"/>
<rect x="1243.4" y="429.2" width="49.2" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="1268" y="440" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#8250df" text-anchor="middle">回复就绪</text>
<path d="M 1180 272 L 1100 272 L 1100 180 L 580 180 L 580 420" fill="none" stroke="#0969da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-0969da)" stroke-dasharray="5 4"/>
<rect x="784.383" y="157.2" width="111.234" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="840" y="168" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#0969da" text-anchor="middle">播放完 + 300ms 冷却</text>
<path d="M 720 304 L 660 304 L 660 388 L 580 420" fill="none" stroke="#0d7d7d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-0d7d7d)" stroke-dasharray="5 4"/>
<rect x="620.068" y="339.2" width="55.864000000000004" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="648" y="350" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#0d7d7d" text-anchor="middle">5s 无语音</text>
<path d="M 720 592 L 660 592 L 660 494 L 580 484" fill="none" stroke="#1a7f37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-1a7f37)" stroke-dasharray="5 4"/>
<rect x="611.836" y="535.2" width="72.328" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="648" y="546" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#1a7f37" text-anchor="middle">8s 超时 / 空</text>
<path d="M 500 484 L 500 620 L 165 620 L 165 484" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-57606a)" stroke-dasharray="5 4"/>
<rect x="297.168" y="621.2" width="65.664" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="330" y="632" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#57606a" text-anchor="middle">关闭 / 卸载</text>
<path d="M 370 484 L 370 700" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-cf222e)"/>
<rect x="335.368" y="579.2" width="85.264" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="378" y="590" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#cf222e" text-anchor="middle">权限 / 服务失败</text>
<path d="M 450 700 L 450 484" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-cf222e)" stroke-dasharray="4 4"/>
<rect x="443.2" y="605.2" width="29.6" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="458" y="616" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#cf222e" text-anchor="middle">重试</text>
<rect x="80" y="790" width="440" height="140" rx="10" ry="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.9"/>
<text x="94" y="812" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start">会话令牌（必须）</text>
<text x="94" y="832" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">arm / disarm / dispose 时 session += 1；</text>
<text x="94" y="849" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">每个 await 之后比较 token，不一致直接丢弃；</text>
<text x="94" y="866" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">否则「关麦后又被异步结果开麦」。</text>
<rect x="540" y="790" width="430" height="140" rx="10" ry="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.9"/>
<text x="554" y="812" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start">定时器</text>
<text x="554" y="832" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">唤醒冷却 1500 ms；</text>
<text x="554" y="849" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">唤醒后等待说话 5000 ms；</text>
<text x="554" y="866" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">指令识别 8000 ms；播报后 300 ms 冷却。</text>
<rect x="990" y="790" width="420" height="140" rx="10" ry="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.9"/>
<text x="1004" y="812" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start">自唤醒抑制</text>
<text x="1004" y="832" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">AEC + speaking 期间不上行；</text>
<text x="1004" y="849" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">播报结束再等 300 ms；</text>
<text x="1004" y="866" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start">TTS 文本里避免出现唤醒词。</text>
<line x1="80" y1="946" x2="106" y2="946" stroke="#0969da" stroke-width="2.4"/>
<circle cx="93" cy="946" r="3.4" fill="#0969da"/>
<text x="114" y="950" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" font-weight="400" fill="#57606a" text-anchor="start">连接 / 播报</text>
<line x1="250" y1="946" x2="276" y2="946" stroke="#0d7d7d" stroke-width="2.4"/>
<circle cx="263" cy="946" r="3.4" fill="#0d7d7d"/>
