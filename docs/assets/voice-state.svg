<text x="1150" y="632" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#8250df" text-anchor="middle">工具返回</text>
<path d="M 1040 560 L 1040 304 L 1180 304" fill="none" stroke="#8250df" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8250df)"/>
