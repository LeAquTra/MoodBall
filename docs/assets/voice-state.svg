<text x="1260.0" y="587" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="middle">acting</text>
<text x="1260.0" y="607" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="9.2" font-weight="700" fill="#8250df" text-anchor="middle">ACTING</text>
<rect x="1180" y="240" width="160" height="64" rx="14" ry="14" fill="#eef7ff" stroke="#b6d7f5" stroke-width="1.2"/>
<text x="1260.0" y="267" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="16" font-weight="650" fill="#1f2328" text-anchor="middle">speaking</text>
<text x="1260.0" y="287" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="9.2" font-weight="700" fill="#0969da" text-anchor="middle">SPEAKING</text>
