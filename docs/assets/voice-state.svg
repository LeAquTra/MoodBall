<path d="M 1120 592 L 1180 592" fill="none" stroke="#8250df" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8250df)"/>
<rect x="1107.368" y="573.2" width="85.264" height="16.8" rx="5" ry="5" fill="#fbfbfa" stroke="none" stroke-width="0"/>
<text x="1150.0" y="584.0" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="9.8" font-weight="500" fill="#8250df" text-anchor="middle">需要视觉 / 工具</text>
<path d="M 1180 612 L 1120 612" fill="none" stroke="#8250df" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-8250df)"/>
