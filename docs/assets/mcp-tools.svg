<rect x="36" y="740" width="1428" height="116" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.1"/>
<text x="54" y="768" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="start">个人项目的默认策略：不审批、不白名单、不沙箱</text>
<text x="54" y="792" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.6" font-weight="400" fill="#57606a" text-anchor="start">• 你添加的 MCP server 和 Python 插件默认视为可信；enabled 开关只用于控制上下文 / token，不是安全门。</text>
<text x="54" y="812" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.6" font-weight="400" fill="#57606a" text-anchor="start">• 工具调用自动执行，结果写入 ToolCall / EventLog；需要复核时看日志，而不是每次弹窗。</text>
<text x="54" y="832" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10.6" font-weight="400" fill="#57606a" text-anchor="start">• 只把 127.0.0.1 / 局域网地址给自己用；不要把带 Key 的服务暴露到公网。</text>
</svg>