<text x="962" y="483" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">工具名 / 参数 / 结果摘要 / 耗时</text>
<text x="962" y="501" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">调试、回放、撤销依据</text>
