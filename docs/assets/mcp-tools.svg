<text x="962" y="348" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">LangGraph 循环</text>
<text x="962" y="371" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">compose → execute_tool → compose</text>
<text x="962" y="389" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">最多 8 次工具调用 / 轮</text>
