<title>MoodBall MCP 与工具扩展</title>
<defs><marker id="a-57606a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="a-0969da" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="a-1a7f37" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="a-8250df" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker><marker id="a-9a6700" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker></defs>
<rect x="0" y="0" width="1500" height="900" fill="#fbfbfa"/>
<text x="44" y="40" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" font-weight="600" fill="#57606a" text-anchor="start">MOODBALL / TOOLS &amp; MCP</text>
<text x="44" y="78" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="29" font-weight="650" fill="#1f2328" text-anchor="start">MCP 与工具扩展：三类工具来源，统一进 ToolRegistry</text>
<text x="44" y="106" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13.5" font-weight="400" fill="#57606a" text-anchor="start">内置工具、Python 插件、MCP server 都是工具；Agent 只关心 name / schema / 调用结果。</text>
<line x1="44" y1="124" x2="1456" y2="124" stroke="#d0d7de"/>
<rect x="36" y="148" width="360" height="560" rx="16" fill="#f5faff" stroke="#b6d7f5" stroke-width="1.1"/>
<text x="54" y="178" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="start">① 工具来源</text>
<rect x="56" y="200" width="320" height="82" rx="10" fill="#eef7ff" stroke="#b6d7f5" stroke-width="1.1"/>
<rect x="56" y="200" width="5" height="82" rx="2" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<text x="72" y="226" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">内置工具</text>
<text x="72" y="249" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">capture_photo / recall_memory</text>
<text x="72" y="267" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">set_emotion / get_time</text>
<rect x="56" y="310" width="320" height="82" rx="10" fill="#eef7ff" stroke="#b6d7f5" stroke-width="1.1"/>
<rect x="56" y="310" width="5" height="82" rx="2" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<text x="72" y="336" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Python 插件</text>
<text x="72" y="359" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">agent/plugins/*.py</text>
<text x="72" y="377" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">暴露 TOOLS 列表，自动发现</text>
<rect x="56" y="420" width="320" height="82" rx="10" fill="#eef7ff" stroke="#b6d7f5" stroke-width="1.1"/>
<rect x="56" y="420" width="5" height="82" rx="2" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<text x="72" y="446" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">MCP · stdio</text>
<text x="72" y="469" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">command + args + env</text>
<text x="72" y="487" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">本地子进程；npx / uvx</text>
<rect x="56" y="530" width="320" height="82" rx="10" fill="#eef7ff" stroke="#b6d7f5" stroke-width="1.1"/>
<rect x="56" y="530" width="5" height="82" rx="2" fill="#0969da" stroke="#0969da" stroke-width="0"/>
<text x="72" y="556" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">MCP · http / sse</text>
<text x="72" y="579" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">url + headers</text>
<text x="72" y="597" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">远程或本机 MCP 服务</text>
<rect x="446" y="148" width="430" height="560" rx="16" fill="#f0fbf3" stroke="#b7e4c7" stroke-width="1.1"/>
<text x="464" y="178" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="start">② 发现与注册</text>
