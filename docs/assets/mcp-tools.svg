<text x="482" y="226" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">MultiServerMCPClient</text>
<text x="482" y="249" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">langchain-mcp-adapters</text>
<text x="482" y="267" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">get_tools() → LangChain tools</text>
<rect x="466" y="312" width="390" height="100" rx="10" fill="#f0fbf3" stroke="#b7e4c7" stroke-width="1.1"/>
<rect x="466" y="312" width="5" height="100" rx="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/>
<text x="482" y="338" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">ToolRegistry</text>
<text x="482" y="361" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">统一 name / description / schema</text>
<text x="482" y="379" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">命名空间：mcp__{server}__{tool}</text>
<text x="482" y="397" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">缓存 / 搜索 / 启用开关</text>
<rect x="466" y="446" width="390" height="82" rx="10" fill="#f0fbf3" stroke="#b7e4c7" stroke-width="1.1"/>
<rect x="466" y="446" width="5" height="82" rx="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/>
<text x="482" y="472" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">ToolSelector</text>
<text x="482" y="495" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">按用户问题选 top-k</text>
<text x="482" y="513" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">默认 12–16 个，避免上下文爆炸</text>
<rect x="466" y="558" width="390" height="82" rx="10" fill="#f0fbf3" stroke="#b7e4c7" stroke-width="1.1"/>
<rect x="466" y="558" width="5" height="82" rx="2" fill="#1a7f37" stroke="#1a7f37" stroke-width="0"/>
<text x="482" y="584" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">execute_tool</text>
<text x="482" y="607" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">解析 tool_calls → 调用 → ToolMessage</text>
<text x="482" y="625" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">超时 / 结果截断 / 记录</text>
