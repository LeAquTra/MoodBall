<text x="962" y="595" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">增删改 / 启停 / 测试 / 刷新工具</text>
<text x="962" y="613" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="start">McpServer + McpTool（SQLite）</text>
